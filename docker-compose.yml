version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skel_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: skel_vertx_app
    profiles: ["app"]  # <-- This keeps it from starting unless explicitly requested
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=skel_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
